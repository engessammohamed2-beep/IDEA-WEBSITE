<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14305f">
<title>Scanner Station</title>
<link rel="manifest" href="/scan.webmanifest">
<link rel="apple-touch-icon" href="/images/scan-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanner">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0f1b33;color:#fff;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:1.1rem;margin:6px 0 10px}
input,select,button{font:inherit}
.in{width:100%;padding:12px;border-radius:10px;border:0;margin:6px 0;color:#111}
.btn{background:#E8631E;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;width:100%}
.btn.ghost{background:#1d3f7a}
.row{display:flex;gap:8px}
#reader{display:none;width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:40px}
#res{margin:12px 0;border-radius:14px;padding:16px;text-align:center;font-size:1.05rem;background:#1d3f7a;min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:6px}
#res b{font-size:1.35rem}
#res.ok{background:#16803c}#res.warn{background:#b77900}#res.bad{background:#b3261e}
.chip{display:inline-block;color:#fff;border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:700}
.log{font-size:.9rem;border-top:1px solid #ffffff22;padding:7px 0;display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.cb{border:2px solid #ffffff55;background:transparent;color:#fff;border-radius:99px;padding:10px 16px;font-weight:700;font-size:.95rem}.cb.on{border-color:#fff;color:#fff}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button{flex:1;padding:11px;border:0;border-radius:10px;background:#1d3f7a;color:#fff;font-weight:700}.tabs button.on{background:#E8631E}
.sr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff22;font-size:.95rem}.sr b.ok{color:#7be0a0}.sr b.no{color:#ffb4ab}
.it{width:100%;margin-top:8px;padding:13px;border-radius:12px;border:2px solid #ffffff66;background:transparent;color:#fff;font-weight:700;font-size:1rem;text-align:start}.it.got{background:#16803c;border-color:#16803c}.it.warn{border-color:#f59e0b}
.muted{opacity:.7;font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center}
.top a,.top button{color:#9fc4ff;background:none;border:0;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" style="display:none">
    <h1>Scanner Station — تسجيل الدخول</h1>
    <input class="in" id="email" placeholder="Phone or email — رقم التليفون أو الإيميل" dir="ltr" autocomplete="username">
    <input class="in" id="password" type="password" placeholder="Password — الباسورد" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
    <button class="btn" onclick="signIn()">Sign in</button>
    <div id="amsg" class="muted" style="margin-top:8px;color:#ffb4ab"></div>
  </div>

  <div id="app" style="display:none">
    <div class="top"><h1>Scanner Station</h1><div><span id="who" class="muted"></span> <button onclick="signOut()">Sign out</button></div></div>
    <select class="in" id="ev"></select>
    <div class="tabs"><button id="tabScan" class="on" onclick="setMode('scan')">مسح — Scan</button><button id="tabStat" onclick="setMode('status')">حالة الضيف — Guest status</button></div>
    <div id="reader"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="camBtn" onclick="toggleCam()">Camera ON / OFF — الكاميرا</button>
    </div>
    <input class="in" id="code" dir="ltr" placeholder="Reader / type code — قارئ QR أو اكتب الكود" autocomplete="off" autocapitalize="characters" onkeydown="if(event.key==='Enter'){scan(this.value);this.value='';}">
    <div id="res">Ready — جاهز للمسح</div>
    <div id="opt" style="display:none;background:#1d3f7a;border-radius:14px;padding:12px;margin-bottom:10px">
      <div class="muted" style="margin-bottom:6px">اختياري — Optional: <b id="optName"></b><br>لو ما اخترتش، كمّل مسح عادي</div>
      <div class="muted">التصنيف — Category</div><div id="optCats" class="chips"></div>
      <div class="muted" style="margin-top:8px">اللقب — Title</div><div id="optTitles" class="chips"></div>
    </div>
    <div id="stat" style="display:none;background:#1d3f7a;border-radius:14px;padding:14px;margin-bottom:10px"></div>
    <div id="count" class="muted"></div>
    <div id="log"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var MODE='scan',PKN={},CURG=null,CUR=null,TT=['Dr.','Prof.','Mr.','Ms.','Mrs.'];
var sb=window.getSupabaseClient(),ME=null,EV=null,EVS=[],cam=null,last='',lastT=0,booted=null,busy=false;
var $=function(i){return document.getElementById(i);};
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toEmail(v){v=(v||'').trim();if(v.indexOf('@')>-1)return v;var d=v.replace(/\D/g,'');return 'staff-'+d+'@staff.ideaeg.online';}
async function signIn(){$('amsg').textContent='';var r=await sb.auth.signInWithPassword({email:toEmail($('email').value),password:$('password').value});if(r.error)$('amsg').textContent='بيانات الدخول غلط — Wrong login';}
async function signOut(){await sb.auth.signOut();location.reload();}
function cats(){var c=EV&&EV.categories;return Array.isArray(c)&&c.length?c:[];}
function catColor(l){var c=cats().filter(function(x){return x.label===l;})[0];return c?c.color:'#64748B';}
function chip(l){return '<span class="chip" style="background:'+catColor(l)+'">'+h(l||'-')+'</span>';}
var AC=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(function(ev){document.addEventListener(ev,unlock,{passive:true});});
function tone(f,d,at,type,vol){try{unlock();var o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=vol||.25;o.connect(g);g.connect(AC.destination);var t=AC.currentTime+(at||0);o.start(t);o.stop(t+d);}catch(e){}}
function tick(){tone(1800,.11,0,'square',.3);try{if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}   /* classic barcode-scanner beep, played the moment a code is read */
function beep(kind){if(kind==='warn'){tone(1100,.09,0);tone(1100,.09,.16);}else if(kind==='bad'){tone(260,.4,0,'sawtooth',.3);try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}}}
function show(cls,html,ok){var r=$('res');r.className=cls;r.innerHTML=html;if(cls!=='ok')beep(cls);}
var LOG=[];
function track(x){var t=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});var e=LOG.filter(function(l){return l.id===x.id;})[0];if(!e){e={id:x.id,time:t};LOG.unshift(e);if(LOG.length>15)LOG.pop();}e.name=x.name;e.cat=x.category||'Delegate';e.title=x.title||'';e.door_set=!!x.door_set;renderLog();return e;}
function renderLog(){$('log').innerHTML=LOG.length?'<div class="muted" style="margin:6px 0">آخر اللي اتمسحوا — دوس على أي اسم لتعديل تصنيفه ولقبه</div>'+LOG.map(function(l,i){return '<div class="log" style="cursor:pointer" onclick="reopen('+i+')"><span>'+h((l.title?l.title+' ':'')+l.name)+' '+chip(l.cat)+'</span><span class="muted">'+h(l.time)+' ✎</span></div>';}).join(''):'';}
window.reopen=function(i){var l=LOG[i];if(!l)return;openOpt({id:l.id,name:l.name,category:l.cat,title:l.title,door_set:l.door_set});$('opt').scrollIntoView({behavior:'smooth',block:'center'});};
async function boot(){
  var s=(await sb.auth.getSession()).data.session;
  if(!s){$('login').style.display='block';return;}
  if(booted===s.user.id)return;booted=s.user.id;
  var me=(await sb.from('staff_members').select('name,role,active,perms').eq('user_id',s.user.id).maybeSingle()).data;
  if(!me||!me.active){await sb.auth.signOut();booted=null;$('login').style.display='block';$('amsg').textContent='الحساب ده مش مصرّح له — No access';return;}
  var p=me.perms||{};
  if(!(me.role==='admin'||p.checkin)){$('login').style.display='none';$('app').style.display='block';$('app').innerHTML='<h1>مفيش صلاحية check-in للحساب ده</h1><p class="muted">You need the check-in permission.</p>';return;}
  ME=me;$('who').textContent=me.name;$('login').style.display='none';$('app').style.display='block';
  var r=await sb.from('reg_events').select('id,slug,title_en,title_ar,categories,items,items_enabled').order('created_at',{ascending:false});
  EVS=r.data||[];
  var keep=null;try{keep=localStorage.getItem('scan_event');}catch(e){}
  $('ev').innerHTML=EVS.map(function(e){return '<option value="'+e.id+'">'+h(e.title_en||e.title_ar||e.slug)+'</option>';}).join('');
  if(EVS.some(function(e){return e.id===keep;}))$('ev').value=keep;
  $('ev').onchange=function(){pickEv();};pickEv();
  $('code').focus();
}
function pickEv(){EV=EVS.filter(function(e){return e.id===$('ev').value;})[0]||null;try{localStorage.setItem('scan_event',$('ev').value);}catch(e){}count();
  PKN={};if(EV)sb.from('reg_packages').select('id,name_en,name_ar').eq('event_id',EV.id).then(function(r){(r.data||[]).forEach(function(p){PKN[p.id]=p.name_en||p.name_ar;});});}
function setMode(m){MODE=m;$('tabScan').className=m==='scan'?'on':'';$('tabStat').className=m==='status'?'on':'';
  $('stat').style.display=m==='status'?'block':'none';if(m==='status'){$('opt').style.display='none';$('log').style.display='none';$('res').className='';$('res').innerHTML='امسح QR الضيف لعرض حالته — Scan a guest QR to see status';}
  else{$('log').style.display='block';if(CUR)$('opt').style.display='block';$('res').className='';$('res').innerHTML='Ready — جاهز للمسح';}
  $('code').focus();}
function itemsOn(){return !!(EV&&EV.items_enabled&&Array.isArray(EV.items)&&EV.items.length);}
function inc(g,it){return !it.pkgs||it.pkgs.indexOf(g.package_id)>-1;}
function ts(t,by){return new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+(by?' — '+h(by):'');}
function yn(ok,txt){return '<b class="'+(ok?'ok':'no')+'">'+(ok?'✓ '+txt:'✗ لا')+'</b>';}
function drawGuest(){var g=CURG;if(!g){return;}
  var rec=g.items_received||{};
  var html='<div style="font-size:1.25rem;font-weight:800">'+h((g.title?g.title+' ':'')+g.name)+'</div><div style="margin:4px 0 8px">'+chip(g.category||'Delegate')+' <span class="muted">'+h(PKN[g.package_id]||'')+' · <span dir="ltr">'+h(g.code)+'</span></span></div>'+
    (g.status==='cancelled'||g.status==='waitlist'?'<div style="background:#b3261e;border-radius:8px;padding:8px;margin-bottom:6px;font-weight:700">الحالة: '+h(g.status)+'</div>':'')+
    (g.payment_status==='unpaid'?'<div style="background:#b77900;border-radius:8px;padding:8px;margin-bottom:6px;font-weight:700">⚠ لم يدفع — UNPAID</div>':'')+
    '<div class="sr"><span>وصل — Arrived</span>'+yn(!!g.arrived_at,ts(g.arrived_at,g.arrived_by))+'</div>'+
    '<div class="sr"><span>طبع النيم تاج — Name tag printed</span>'+yn(!!g.tag_printed_at,g.tag_printed_at?ts(g.tag_printed_at,g.tag_printed_by):'')+'</div>'+
    '<div class="sr"><span>طبع الشهادة — Certificate printed</span>'+yn(!!g.cert_printed_at,g.cert_printed_at?ts(g.cert_printed_at,g.cert_printed_by):'')+'</div>';
  if(itemsOn())html+=EV.items.map(function(it){var got=rec[it.key],ok=inc(g,it);return '<button class="it'+(got?' got':'')+(ok?'':' warn')+'" onclick="togItem(\''+it.key+'\')">'+(got?'✓ ':'')+(ok?'':'⚠ ')+'استلم '+h(it.ar||it.en||it.key)+(got?'<br><span style="font-weight:400;font-size:.8rem">'+ts(got.at,got.by)+'</span>':'')+(ok?'':'<br><span style="font-weight:400;font-size:.8rem">الباقة دي مفيهاش البند ده</span>')+'</button>';}).join('');
  $('stat').innerHTML=html;}
async function lookup(code){
  var r=await sb.from('reg_registrations').select('id,name,title,code,status,category,package_id,payment_status,arrived_at,arrived_by,tag_printed_at,tag_printed_by,cert_printed_at,cert_printed_by,items_received').eq('event_id',EV.id).eq('code',code).maybeSingle();
  if(r.error){show('bad','<b>Error</b>'+h(r.error.message),false);return;}
  if(!r.data){CURG=null;$('stat').innerHTML='';show('bad','<b>Code not found — الكود مش موجود</b><span dir="ltr">'+h(code)+'</span>',false);return;}
  CURG=r.data;$('res').className='ok';$('res').innerHTML='<b>'+h(CURG.name)+'</b>';drawGuest();}
async function togItem(key){
  if(!CURG)return;var it=EV.items.filter(function(i){return i.key===key;})[0];if(!it)return;var got=!!(CURG.items_received&&CURG.items_received[key]);
  if(!got&&!inc(CURG,it)&&!confirm('⚠ تحذير!\nالباقة دي مفيهاش "'+(it.ar||it.en)+'".\nتسلّمه برضه؟'))return;
  var r=await sb.rpc('toggle_reg_item',{p_reg:CURG.id,p_key:key,p_on:!got,p_by:ME.name});
  if(r.error){show('bad','<b>Error</b>'+h(r.error.message),false);return;}
  CURG.items_received=r.data||{};drawGuest();tick();}
async function count(){
  if(!EV)return;
  var a=await sb.from('reg_registrations').select('id',{count:'exact',head:true}).eq('event_id',EV.id).not('arrived_at','is',null);
  $('count').textContent='Scanned so far: '+(a.count||0)+' — اتمسح لحد دلوقتي';
}
async function scan(txt){
  var code=String(txt||'').trim().toUpperCase();if(!code||!EV||busy)return;
  busy=true;tick();
  try{
    if(MODE==='status'){await lookup(code);return;}
    var r=await sb.from('reg_registrations').select('id,name,title,status,category,door_set,arrived_at,arrived_by,payment_status').eq('event_id',EV.id).eq('code',code).maybeSingle();
    if(r.error){show('bad','<b>Error</b>'+h(r.error.message),false);return;}
    var x=r.data;
    if(!x){show('bad','<b>Code not found — الكود مش موجود</b><span dir="ltr">'+h(code)+'</span>',false);return;}
    if(x.status==='cancelled'||x.status==='waitlist'){show('bad','<b>'+h(x.name)+'</b>الحالة: '+h(x.status),false);return;}
    if(x.status==='attended'){show('warn','<b>'+h(x.name)+'</b>متسجل بالفعل — Already checked in',false);return;}
    if(x.arrived_at){var t=new Date(x.arrived_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});track(x);openOpt(x);show('warn','<b>'+h(x.name)+'</b>متسجل بالفعل — Already scanned at '+t+(x.arrived_by?' ('+h(x.arrived_by)+')':''),false);return;}
    var u=await sb.from('reg_registrations').update({arrived_at:new Date().toISOString(),arrived_by:ME.name}).eq('id',x.id).is('arrived_at',null).select('id');
    if(u.error){show('bad','<b>Error</b>'+h(u.error.message),false);return;}
    if(!u.data||!u.data.length){show('warn','<b>'+h(x.name)+'</b>متسجل بالفعل — Already scanned',false);return;}
    openOpt(x);
    show('ok','<b>'+h(x.name)+'</b>'+(x.payment_status==='unpaid'?'<span>⚠ UNPAID — لم يدفع</span>':'')+'<span>وصل ✓ — الاستقبال هيطبع</span>',true);
    track(x);count();
  }finally{busy=false;}
}
function openOpt(x){var c=x.category||'Delegate',t=x.title||'';CUR={id:x.id,name:x.name,origCat:c,origTitle:t,cat:c,title:t,catOn:!!x.door_set||c!=='Delegate',door:!!x.door_set};$('optName').textContent=x.name;$('opt').style.display='block';drawOpt();}
function drawOpt(){
  var cl=cats();if(!cl.length)cl=[{label:'Delegate',color:'#2563EB'},{label:'Faculty',color:'#7C3AED'},{label:'Speaker',color:'#E8631E'},{label:'Organizer',color:'#16A34A'},{label:'Sponsor',color:'#CA8A04'},{label:'Press',color:'#DB2777'}];
  $('optCats').innerHTML=cl.map(function(c){var on=CUR.catOn&&CUR.cat===c.label;return '<button class="cb'+(on?' on':'')+'" style="'+(on?'background:'+c.color:'')+'" onclick="pickOpt(\'cat\',this.dataset.v)" data-v="'+h(c.label)+'">'+h(c.label)+'</button>';}).join('');
  $('optTitles').innerHTML=TT.map(function(t){var on=CUR.title===t;return '<button class="cb'+(on?' on':'')+'" style="'+(on?'background:#16803c':'')+'" onclick="pickOpt(\'title\',this.dataset.v)" data-v="'+h(t)+'">'+h(t)+'</button>';}).join('');
}
async function pickOpt(k,v){
  if(!CUR)return;var old={cat:CUR.cat,title:CUR.title,catOn:CUR.catOn,door:CUR.door};
  if(k==='cat'){if(CUR.catOn&&CUR.cat===v){CUR.cat=CUR.origCat;CUR.catOn=false;}else{CUR.cat=v;CUR.catOn=true;}}
  else{CUR.title=(CUR.title===v)?'':v;}
  CUR.door=true;drawOpt();
  var r=await sb.from('reg_registrations').update({category:CUR.cat,title:CUR.title,door_set:true}).eq('id',CUR.id);
  if(r.error){Object.assign(CUR,old);drawOpt();show('bad','<b>Error</b>'+h(r.error.message),false);return;}
  track({id:CUR.id,name:CUR.name,category:CUR.cat,title:CUR.title,door_set:true});
  var bits=[CUR.title,CUR.catOn?CUR.cat:''].filter(Boolean).join(' · ');
  show('ok','<b>'+h(CUR.name)+'</b><span>'+(bits?'✓ '+h(bits):'وصل ✓')+'</span><span>الاستقبال هيطبع</span>',true);tick();
}
function toggleCam(){
  if(!window.Html5Qrcode)return alert('Scanner library not loaded');
  if(cam){cam.stop().catch(function(){});cam=null;$('reader').style.display='none';return;}
  $('reader').style.display='block';cam=new Html5Qrcode('reader');
  cam.start({facingMode:'environment'},{fps:10,qrbox:240},function(t){if(t===last&&Date.now()-lastT<4000)return;last=t;lastT=Date.now();scan(t);}).catch(function(e){alert(e);cam=null;});
}
boot();sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_IN'||e==='INITIAL_SESSION')boot();});
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#app')&&!/SELECT|BUTTON|INPUT/.test(e.target.tagName)&&$('code'))$('code').focus();});
</script>
</body>
</html>
